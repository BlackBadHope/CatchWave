plugins { id 'com.android.application' }
if (providers.gradleProperty('catchwaveBuildRoot').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('catchwaveBuildRoot').get() + '/app'))
}
android {
    testBuildType 'release'
    namespace 'app.catchwave'
    compileSdk 36
    defaultConfig { applicationId 'app.catchwave'; minSdk 30; targetSdk 35; versionCode 6; versionName '0.1.5'; testInstrumentationRunner 'app.catchwave.TransportProbe' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true; disable 'OldTargetApi', 'ObsoleteSdkInt' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
