name: Host UI preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Render WinForms preview
        shell: pwsh
        run: |
          dotnet build windows/CatchWave.Host/CatchWave.Host.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path host-ui-preview | Out-Null
          dotnet windows/CatchWave.Host/bin/Release/net9.0-windows/CatchWave.Host.dll --ui-preview "$PWD\host-ui-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem host-ui-preview | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-ui-preview
          path: host-ui-preview/*.png
          if-no-files-found: error
