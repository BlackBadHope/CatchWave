name: Validate Android and Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Android unit tests, lint and APK
        shell: pwsh
        run: .\gradlew.bat --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Windows Host build and self-test
        shell: pwsh
        run: .\windows\build.ps1 -Validate
      - name: Windows Host single-file package
        shell: pwsh
        run: |
          $setup = Join-Path $env:TEMP 'innosetup-6.4.3.exe'
          curl.exe -fsSL -o $setup https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\windows\build.ps1 -Package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'dist\CatchWave-Host\CatchWave.Host.exe')) { throw 'Missing single-file exe' }
          if (-not (Test-Path -LiteralPath 'dist\CatchWave-Host-Setup.exe')) { throw 'Missing installer' }
          $loose = Get-ChildItem -LiteralPath 'dist\CatchWave-Host' -Recurse -File | Where-Object { $_.Extension -in '.dll','.cmd','.bat' }
          if ($loose) { throw "Package still contains $($loose.Name -join ', ')" }
      - name: Java and Windows interoperability
        shell: pwsh
        run: .\windows\test-interop.ps1
